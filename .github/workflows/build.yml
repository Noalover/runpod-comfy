name: Build and verify RunPod ComfyUI

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - bake.sh
      - node-repos.txt
      - provision-hook.sh
      - provision.sh
      - .github/workflows/build.yml
  workflow_dispatch:
  schedule:
    # Rebuild daily so the baked sources track upstream releases/commits.
    - cron: '37 4 * * *'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: runpod-comfy-image
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/noalover/runpod-comfy
      CANDIDATE: ghcr.io/noalover/runpod-comfy:candidate-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get clean

          docker system prune -af || true

          echo "After cleanup:"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # SAFETY GATE: never push :latest during the build. An unsuccessful
      # build or smoke test leaves the last known-good :latest untouched.
      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.CANDIDATE }}
          build-args: |
            BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify candidate image
        run: |
          docker pull "$CANDIDATE"
          docker run --rm --entrypoint /bin/bash "$CANDIDATE" -lc '
            set -euo pipefail
            bash -n /provision-hook.sh /opt/runpod-comfy/bake.sh
            test -f /opt/comfyui-baked/main.py
            test -d /opt/comfyui-baked/custom_nodes/ComfyUI-KJNodes
            test -f /opt/runpod-comfy/build-id
            python3.12 -m pip check
            while IFS= read -r repo || [[ -n "$repo" ]]; do
              [[ -z "$repo" || "$repo" == \#* ]] && continue
              node="${repo##*/}"
              test -d "/opt/comfyui-baked/custom_nodes/$node"
              test -f "/opt/runpod-comfy/baked-node-stamps/$node"
            done < /opt/runpod-comfy/node-repos.txt
          '

      - name: Promote verified candidate to latest
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            "$CANDIDATE"
